code:
  - '**'
  - '!README.md'
  - '!README_ZH.md'
  - '!docs/**'
  - '!backend/app/services/model_metadata_snapshot.json'
model_metadata:
  - 'backend/app/services/model_metadata_snapshot.json'
image_inputs: &image_inputs
  - 'Dockerfile'
  - '.dockerignore'
  - 'LICENSE'
  - 'backend/app/**'
  - 'backend/pyproject.toml'
  - 'backend/uv.lock'
  - 'frontend/package.json'
  - 'frontend/pnpm-lock.yaml'
  - 'frontend/tsconfig*.json'
  - 'frontend/vite.config.ts'
  - 'frontend/index.html'
  - 'frontend/src/**'
  - 'frontend/public/**'
container_validation:
  - *image_inputs
  - '!backend/app/services/model_metadata_snapshot.json'
  - '.github/workflows/frontend-quality.yml'
  - '.github/ci-paths.yml'
  - '.github/scripts/quality-gate.py'
  - 'backend/tests/test_ci_quality_gate.py'
  - 'backend/tests/conftest.py'
  - 'backend/tests/runtime_environment.py'
  - 'backend/tests/e2e/conftest.py'
  - 'backend/tests/e2e/browser_support.py'
  - 'backend/tests/e2e/diagnostics.py'
  - 'backend/tests/e2e/production_server.py'
  - 'backend/tests/e2e/test_production_frontend.py'
