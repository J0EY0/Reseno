name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  queue: ${{ (github.ref == 'refs/heads/main' || github.ref_type == 'tag') && 'max' || 'single' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref_type != 'tag' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run_checks: ${{ github.ref_type == 'tag' && 'true' || steps.filter.outputs.code }}
      image_inputs: ${{ github.ref_type == 'tag' && 'true' || steps.filter.outputs.image_inputs }}
      container_validation: ${{ (github.ref_type == 'tag' || (steps.filter.outputs.code == 'true' && steps.filter.outputs.image_inputs == 'true')) && 'true' || steps.filter.outputs.container_validation }}
      metadata_only: ${{ (github.ref_type != 'tag' && steps.filter.outputs.code == 'false' && steps.filter.outputs.model_metadata == 'true') && 'true' || 'false' }}
    steps:
      - name: Check out repository
        if: github.ref_type != 'tag'
        uses: actions/checkout@v6
      - name: Detect code changes
        if: github.ref_type != 'tag'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          token: ''
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.ref }}
          predicate-quantifier: some-with-excludes
          filters: .github/ci-paths.yml

  model-metadata:
    needs: changes
    if: >-
      !cancelled() &&
      (needs.changes.result != 'success' || needs.changes.outputs.metadata_only != 'false')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Validate change detection
        working-directory: .
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          METADATA_ONLY: ${{ needs.changes.outputs.metadata_only }}
        run: |
          test "$CHANGES_RESULT" = 'success'
          test "$METADATA_ONLY" = 'true'
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          version: "0.11.14"
          working-directory: backend
      - name: Install locked backend dependencies
        run: uv sync --locked --all-groups
      - name: Test model metadata
        run: >-
          uv run --locked pytest -q
          tests/test_model_metadata_*.py
          tests/test_thinking_mode.py
          tests/test_llm_shared_context.py
          tests/test_model_provider_context_limits.py
          tests/test_model_context_reference_api.py
          --junitxml=test-results/model-metadata.xml
      - name: Upload model metadata test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: model-metadata-test-results
          path: backend/test-results/
          if-no-files-found: ignore
          retention-days: 7

  backend:
    needs: changes
    if: >-
      !cancelled() &&
      (needs.changes.result != 'success' || needs.changes.outputs.run_checks != 'false')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Validate change detection
        working-directory: .
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUN_CHECKS: ${{ needs.changes.outputs.run_checks }}
        run: |
          test "$CHANGES_RESULT" = 'success'
          test "$RUN_CHECKS" = 'true'
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          version: "0.11.14"
          working-directory: backend
      - name: Install locked backend dependencies
        run: uv sync --locked --all-groups
      - name: Lint backend
        run: uv run --locked ruff check .
      - name: Type-check backend
        run: uv run --locked mypy app
      - name: Test backend
        run: uv run --locked pytest -q --durations=20 --junitxml=test-results/backend.xml
      - name: Upload backend test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: backend/test-results/
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    needs: changes
    if: >-
      !cancelled() &&
      (needs.changes.result != 'success' || needs.changes.outputs.run_checks != 'false')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Validate change detection
        working-directory: .
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUN_CHECKS: ${{ needs.changes.outputs.run_checks }}
        run: |
          test "$CHANGES_RESULT" = 'success'
          test "$RUN_CHECKS" = 'true'
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: frontend/.node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Check frontend quality
        run: pnpm check:frontend

  browser-smoke:
    if: >-
      needs.changes.outputs.run_checks == 'true' &&
      (github.event_name == 'pull_request' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/'))
    needs: [changes, backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Run Linux browser checks
        working-directory: frontend
        run: bash ../.github/scripts/check-browser-linux.sh
      - name: Upload browser test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-results
          path: backend/test-results/
          if-no-files-found: ignore
          retention-days: 7

  container-validation:
    name: Container validation (${{ matrix.arch }})
    needs: changes
    if: >-
      needs.changes.outputs.container_validation == 'true' &&
      (github.event_name == 'pull_request' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      E2E_ARTIFACTS_DIR: ${{ github.workspace }}/backend/test-results/container
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          version: "0.11.14"
          working-directory: backend
      - name: Install locked backend dependencies
        working-directory: backend
        run: uv sync --locked --all-groups
      - name: Install Chromium
        working-directory: backend
        run: uv run --locked playwright install --with-deps chromium
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long
            type=semver,pattern={{version}},enable=${{ github.ref_type == 'tag' }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
      - name: Build test container
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          tags: reseno-ci:check
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          outputs: type=oci,dest=${{ runner.temp }}/container-${{ matrix.arch }}.tar
          cache-from: |
            type=gha,scope=reseno-container-${{ matrix.arch }}
            type=gha,scope=reseno-container
          cache-to: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && format('type=gha,scope=reseno-container-{0},mode=max', matrix.arch) || '' }}
      - name: Load exported container
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          skopeo --override-os linux --override-arch "$ARCH" copy \
            "oci-archive:$RUNNER_TEMP/container-$ARCH.tar" \
            "docker-archive:$RUNNER_TEMP/runtime.tar:reseno-ci:check"
          docker load --input "$RUNNER_TEMP/runtime.tar"
          rm "$RUNNER_TEMP/runtime.tar"
      - name: Test container startup and production flows
        working-directory: backend
        run: RUN_BROWSER_E2E=1 E2E_CONTAINER_IMAGE=reseno-ci:check uv run --locked pytest tests/e2e/test_production_frontend.py -q --junitxml=test-results/container-${{ matrix.arch }}.xml
      - name: Save tested container
        if: >-
          github.event_name == 'push' &&
          ((github.ref == 'refs/heads/main' && needs.changes.outputs.image_inputs == 'true') ||
          startsWith(github.ref, 'refs/tags/v'))
        uses: actions/upload-artifact@v7
        with:
          name: tested-container-${{ matrix.arch }}
          path: ${{ runner.temp }}/container-${{ matrix.arch }}.tar
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 7
      - name: Upload container test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: container-test-results-${{ matrix.arch }}
          path: backend/test-results/
          if-no-files-found: ignore
          retention-days: 7

  quality-gate:
    name: Quality gate
    if: always()
    needs: [changes, model-metadata, backend, frontend, browser-smoke, container-validation]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Validate required results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 .github/scripts/quality-gate.py

  docker:
    name: Publish container
    if: >-
      !cancelled() &&
      needs.quality-gate.result == 'success' &&
      github.event_name == 'push' &&
      ((github.ref == 'refs/heads/main' && needs.changes.outputs.image_inputs == 'true' &&
      needs.changes.outputs.container_validation == 'true') ||
      startsWith(github.ref, 'refs/tags/v'))
    needs: [changes, quality-gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate release tag
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::Release tags must use vMAJOR.MINOR.PATCH, for example v0.1.0.'
            exit 1
          fi
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo '::error::Release tags must point to a commit already merged into main.'
            exit 1
          fi
      - name: Resolve current main
        if: github.ref == 'refs/heads/main'
        id: main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          echo "sha=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"
      - name: Check current main image inputs
        if: github.ref == 'refs/heads/main'
        id: main-changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          token: ''
          base: ${{ github.sha }}
          ref: ${{ steps.main.outputs.sha }}
          predicate-quantifier: some-with-excludes
          filters: .github/ci-paths.yml
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long
            type=semver,pattern={{version}},enable=${{ github.ref_type == 'tag' }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Download tested containers
        if: github.ref_type == 'tag' || steps.main-changes.outputs.image_inputs == 'false'
        uses: actions/download-artifact@v8
        with:
          pattern: tested-container-*
          path: ${{ runner.temp }}/tested-containers
          merge-multiple: true
      - name: Log in to GHCR
        if: github.ref_type == 'tag' || steps.main-changes.outputs.image_inputs == 'false'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested containers
        if: github.ref_type == 'tag' || steps.main-changes.outputs.image_inputs == 'false'
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          for arch in amd64 arm64; do
            test -s "$RUNNER_TEMP/tested-containers/container-$arch.tar"
          done
          sources=()
          for arch in amd64 arm64; do
            archive="$RUNNER_TEMP/tested-containers/container-$arch.tar"
            skopeo inspect --raw "oci-archive:$archive" > "$RUNNER_TEMP/manifest-$arch.json"
            digest=$(skopeo manifest-digest "$RUNNER_TEMP/manifest-$arch.json")
            skopeo copy --all --preserve-digests \
              --authfile "${DOCKER_CONFIG:-$HOME/.docker}/config.json" \
              --digestfile "$RUNNER_TEMP/digest-$arch" \
              "oci-archive:$archive" "docker://$image@$digest"
            test "$(cat "$RUNNER_TEMP/digest-$arch")" = "$digest"
            sources+=("$image@$digest")
          done
          tags=()
          while IFS= read -r tag; do
            tags+=(--tag "$tag")
          done <<< "$IMAGE_TAGS"
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
