name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_checks: ${{ github.ref_type == 'tag' && 'true' || steps.filter.outputs.code }}
    steps:
      - name: Check out repository
        if: github.ref_type != 'tag'
        uses: actions/checkout@v6
      - name: Detect code changes
        if: github.ref_type != 'tag'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          token: ''
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.ref }}
          predicate-quantifier: every
          filters: |
            code:
              - '!README.md'
              - '!README_ZH.md'
              - '!docs/**'

  backend:
    needs: changes
    if: >-
      !cancelled() &&
      (needs.changes.result != 'success' || needs.changes.outputs.run_checks != 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Validate change detection
        working-directory: .
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUN_CHECKS: ${{ needs.changes.outputs.run_checks }}
        run: |
          test "$CHANGES_RESULT" = 'success'
          test "$RUN_CHECKS" = 'true'
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          python-version: "3.13"
          version: "0.11.14"
          working-directory: backend
      - name: Install locked backend dependencies
        run: uv sync --locked --all-groups
      - name: Lint backend
        run: uv run --locked ruff check .
      - name: Type-check backend
        run: uv run --locked mypy app
      - name: Test backend
        run: uv run --locked pytest -q --durations=20 --junitxml=test-results/backend.xml
      - name: Upload backend test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: backend/test-results/
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    needs: changes
    if: >-
      !cancelled() &&
      (needs.changes.result != 'success' || needs.changes.outputs.run_checks != 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Validate change detection
        working-directory: .
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUN_CHECKS: ${{ needs.changes.outputs.run_checks }}
        run: |
          test "$CHANGES_RESULT" = 'success'
          test "$RUN_CHECKS" = 'true'
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Check frontend quality
        run: pnpm check:frontend

  browser-smoke:
    if: >-
      needs.changes.outputs.run_checks == 'true' &&
      (github.event_name == 'pull_request' ||
      github.ref_name == github.event.repository.default_branch ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v'))
    needs: [changes, backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      E2E_ARTIFACTS_DIR: ${{ github.workspace }}/backend/test-results/browser
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          python-version: "3.13"
          version: "0.11.14"
          working-directory: backend
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install locked backend dependencies
        working-directory: backend
        run: uv sync --locked --all-groups
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        working-directory: backend
        run: uv run --locked playwright install --with-deps chromium
      - name: Build production frontend
        working-directory: frontend
        run: pnpm build --manifest
      - name: Test production frontend hosting
        working-directory: backend
        run: RUN_BROWSER_E2E=1 uv run --locked pytest tests/e2e/test_production_frontend.py -q --junitxml=test-results/production.xml
      - name: Test production editor chunk recovery
        working-directory: backend
        run: RUN_BROWSER_E2E=1 E2E_FRONTEND_MODE=preview uv run --locked pytest tests/e2e/test_editor_chunk_recovery.py -q --junitxml=test-results/editor-chunk-recovery.xml
      - name: Run browser smoke tests
        working-directory: frontend
        run: pnpm test:workspace-network:smoke --junitxml=test-results/browser-smoke.xml
      - name: Run PDF ATS tests
        working-directory: backend
        run: RUN_BROWSER_E2E=1 uv run --locked pytest tests/e2e/test_pdf_ats.py -q --junitxml=test-results/pdf-ats.xml
      - name: Upload browser test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-results
          path: backend/test-results/
          if-no-files-found: ignore
          retention-days: 7

  docker:
    name: Publish container
    if: >-
      needs.changes.outputs.run_checks == 'true' &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [changes, backend, frontend, browser-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate release tag
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::Release tags must use vMAJOR.MINOR.PATCH, for example v0.1.0.'
            exit 1
          fi
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo '::error::Release tags must point to a commit already merged into main.'
            exit 1
          fi
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long
            type=semver,pattern={{version}},enable=${{ github.ref_type == 'tag' }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push container
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
