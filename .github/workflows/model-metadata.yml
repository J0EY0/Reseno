name: Model metadata

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: model-metadata
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          python-version: "3.13"
          version: "0.11.14"
          working-directory: backend
      - name: Install locked backend dependencies
        working-directory: backend
        run: uv sync --locked --all-groups
      - name: Generate bundled metadata
        working-directory: backend
        run: |
          cp app/services/model_metadata_snapshot.json "$RUNNER_TEMP/model-metadata-base.json"
          uv run --locked python -m scripts.update_model_metadata
      - name: Verify model metadata
        working-directory: backend
        run: uv run --locked pytest tests/test_model_metadata_*.py tests/test_thinking_mode.py -q
      - name: Summarize metadata changes
        working-directory: backend
        run: |
          uv run --locked python -m scripts.model_metadata_report \
            --base "$RUNNER_TEMP/model-metadata-base.json" \
            --updated app/services/model_metadata_snapshot.json \
            --output "$RUNNER_TEMP/model-metadata-pr.md"
          cat >> "$RUNNER_TEMP/model-metadata-pr.md" <<'EOF'

          Validation: metadata generation, report, cache, discovery, and thinking mode tests passed in the update workflow.
          EOF
      - name: Open or update metadata pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          UPDATE_BRANCH: automation/model-metadata
        run: |
          set -euo pipefail
          snapshot=backend/app/services/model_metadata_snapshot.json
          if git diff --quiet -- "$snapshot"; then
            exit 0
          fi
          git switch -c "$UPDATE_BRANCH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$snapshot"
          git commit -m "chore(models): refresh bundled model metadata"
          expected_head="$(git ls-remote --heads origin "$UPDATE_BRANCH" | cut -f 1)"
          git push --force-with-lease="refs/heads/$UPDATE_BRANCH:$expected_head" origin "HEAD:refs/heads/$UPDATE_BRANCH"
          existing_pr="$(gh pr list --base "$BASE_BRANCH" --head "$UPDATE_BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$existing_pr" ]; then
            gh pr create --base "$BASE_BRANCH" --head "$UPDATE_BRANCH" --title "chore(models): refresh bundled model metadata" --body-file "$RUNNER_TEMP/model-metadata-pr.md"
          else
            gh pr edit "$existing_pr" --body-file "$RUNNER_TEMP/model-metadata-pr.md"
          fi
