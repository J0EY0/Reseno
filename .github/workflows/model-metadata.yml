name: Update model metadata

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-metadata
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Read existing update branch
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          UPDATE_BRANCH: automation/model-metadata
        run: |
          set -euo pipefail
          existing_pr="$(gh pr list --base "$BASE_BRANCH" --head "$UPDATE_BRANCH" --state open --json number --jq '.[0].number // empty')"
          expected_head="$(git ls-remote --heads origin "$UPDATE_BRANCH" | cut -f 1)"
          if [ -n "$expected_head" ]; then
            git fetch --no-tags origin "$expected_head"
            git show "$expected_head:backend/app/services/model_metadata_snapshot.json" > "$RUNNER_TEMP/model-metadata-previous.json"
          fi
          echo "head=$expected_head" >> "$GITHUB_OUTPUT"
          echo "pr=$existing_pr" >> "$GITHUB_OUTPUT"
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          version: "0.11.14"
          working-directory: backend
      - name: Install locked backend dependencies
        working-directory: backend
        run: uv sync --locked --all-groups
      - name: Generate bundled metadata
        id: generate
        working-directory: backend
        env:
          PREVIOUS_HEAD: ${{ steps.previous.outputs.head }}
        run: |
          args=()
          if [ -n "$PREVIOUS_HEAD" ]; then
            args+=(--previous-snapshot "$RUNNER_TEMP/model-metadata-previous.json")
          fi
          uv run --locked python -m scripts.update_model_metadata "${args[@]}" \
            --report "$RUNNER_TEMP/model-metadata-pr.md" --github-output "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/model-metadata-pr.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify model metadata
        if: steps.generate.outputs.changed == 'true'
        working-directory: backend
        run: uv run --locked pytest tests/test_model_metadata_*.py tests/test_thinking_mode.py tests/test_llm_shared_context.py tests/test_model_provider_context_limits.py tests/test_model_context_reference_api.py -q
      - name: Open or update metadata pull request
        if: steps.generate.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          UPDATE_BRANCH: automation/model-metadata
          PREVIOUS_HEAD: ${{ steps.previous.outputs.head }}
          EXISTING_PR: ${{ steps.previous.outputs.pr }}
        run: bash .github/scripts/model-metadata-pr.sh
