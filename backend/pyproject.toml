[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reseno-backend"
version = "0.2.0"
description = "FastAPI backend for Reseno"
requires-python = ">=3.12"
dependencies = [
    "authlib>=1.8.0",
    "cryptography>=48.0.0",
    "fastapi>=0.115.0",
    "filelock>=3.32.5",
    "httpx>=0.27.0",
    "httpx2>=2.12.0",
    "itsdangerous>=2.2.0",
    "jsonschema>=4.25.0",
    "openai>=2.38.0",
    "playwright>=1.59.0",
    "pyjwt>=2.13.0",
    "pypdf>=6.0.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.8.0",
    "types-authlib>=1.7.2.20260901",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.setuptools.package-data]
"app.db" = ["*.sql"]
"app.services" = ["*.json", "model_metadata_licenses.txt"]
"app.services.agent" = ["*.json"]
"app.services.agent.prompts" = ["*.md"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
untyped_calls_exclude = ["authlib"]

[tool.pytest.ini_options]
markers = [
    "browser_smoke: critical real-browser regressions required by the default CI gate",
]
