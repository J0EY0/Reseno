[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resumate-backend"
version = "0.1.0"
description = "FastAPI backend for ResuMate"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=48.0.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "jsonschema>=4.25.0",
    "openai>=2.38.0",
    "playwright>=1.59.0",
    "pyjwt>=2.13.0",
    "pypdf>=6.0.0",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[tool.setuptools.package-data]
"app.db" = ["*.sql"]
"app.services" = ["*.json"]
"app.services.agent" = ["*.json"]
"app.services.agent.prompts" = ["*.md"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
markers = [
    "browser_smoke: critical real-browser regressions required by the default CI gate",
]
